version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'
    open-pull-requests-limit: 5
    groups:
      # Lint and test tooling churns often and rarely needs individual review.
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'
