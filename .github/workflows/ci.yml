name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci
          npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        # YouTube answers datacenter IPs with "Sign in to confirm you're not a
        # bot", so real downloads cannot succeed on a runner. The simulated
        # downloader exercises the same code paths without the network.
        env:
          YOURMINE_FAKE_DOWNLOADS: '1'
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t yourmine-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t yourmine-frontend:ci .

      - name: Verify images do not run as root
        run: |
          for image in yourmine-backend:ci yourmine-frontend:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            echo "$image runs as $user"
          done

      # Building proves the image assembles; it does not prove it serves.
      # A healthcheck that addressed `localhost` shipped broken because this
      # job only ever built.
      - name: Verify images actually serve and report healthy
        run: |
          docker run -d --name ym-backend -p 8000:8000 yourmine-backend:ci
          docker run -d --name ym-frontend -p 3000:3000 yourmine-frontend:ci

          for _ in $(seq 1 40); do
            backend=$(docker inspect ym-backend --format '{{.State.Health.Status}}')
            frontend=$(docker inspect ym-frontend --format '{{.State.Health.Status}}')
            echo "backend=$backend frontend=$frontend"
            if [ "$backend" = healthy ] && [ "$frontend" = healthy ]; then
              healthy=1
              break
            fi
            sleep 3
          done

          if [ "${healthy:-}" != 1 ]; then
            echo "::error::containers never reported healthy"
            docker logs ym-backend
            docker logs ym-frontend
            exit 1
          fi

          curl -fsS http://localhost:8000/ > /dev/null
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          echo "both containers serve and report healthy"

      - name: Tear down
        if: always()
        run: docker rm -f ym-backend ym-frontend 2>/dev/null || true
