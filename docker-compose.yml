services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/supremjerem/yourmine-backend:latest
    container_name: yourmine-backend
    # Published on loopback only: the API has no authentication.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/Downloads:/home/yourmine/Downloads
    environment:
      - PYTHONUNBUFFERED=1
      - YOURMINE_HOST=0.0.0.0
      - YOURMINE_OUTPUT_DIR=/home/yourmine/Downloads
      - YOURMINE_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - yourmine-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Inlined into the bundle at build time, so it must be set here
        # rather than as a runtime environment variable.
        VITE_API_URL: http://localhost:8000
    image: ghcr.io/supremjerem/yourmine-frontend:latest
    container_name: yourmine-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - yourmine-network

networks:
  yourmine-network:
    driver: bridge
