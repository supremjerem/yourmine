server {
    listen 3000;
    # Also accept IPv6: inside the container `localhost` resolves to ::1
    # first, which made the healthcheck fail against an IPv4-only listener.
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routed to the app, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients on old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
